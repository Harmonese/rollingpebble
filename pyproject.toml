[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollingpebble"
version = "0.6.1"
description = "Local WebUI frontend for py-roller and pylrclib."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Harmonese" }]
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pylrclib-cli>=0.4.6",
]

[project.optional-dependencies]
roller = []
full = []
dev = ["ruff>=0.6", "pytest>=8", "build>=1.2"]

[project.scripts]
rollingpebble = "rollingpebble.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["rollingpebble*"]

[tool.setuptools.package-data]
rollingpebble = ["frontend_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
